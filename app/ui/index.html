<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DocFlow | Knowledge workspace</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="/react-app.js?v=16" defer></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;600;700&display=swap');

        :root {
            --ink: #16201d;
            --muted: #67716d;
            --paper: #f5f3ed;
            --panel: #fffdf8;
            --line: #d9ddd4;
            --mint: #a7e8c6;
            --mint-dark: #226342;
            --coral: #ed755e;
            --shadow: 0 20px 55px rgba(35, 54, 44, .1);
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            color: var(--ink);
            background: var(--paper);
            font-family: 'Space Grotesk', sans-serif;
        }

        body:before {
            content: '';
            position: fixed;
            inset: 0;
            pointer-events: none;
            opacity: .34;
            background-image: radial-gradient(#c8d0c5 1px, transparent 1px);
            background-size: 19px 19px;
            mask-image: linear-gradient(to bottom, #000, transparent 75%);
        }

        button,
        input,
        select,
        textarea {
            font: inherit;
        }

        button {
            cursor: pointer;
        }

        .shell {
            position: relative;
            max-width: 1180px;
            margin: auto;
            padding: 28px 24px 54px;
        }

        .login-shell {
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px;
        }

        .login-panel {
            width: min(100%, 460px);
            padding: 32px;
        }

        .login-panel h1 {
            margin-top: 22px;
            font-size: 48px;
        }

        .login-panel .intro {
            margin-bottom: 28px;
            font-size: 15px;
        }

        .login-error {
            color: var(--coral);
            font-size: 13px;
        }

        .google-button {
            margin-top: 8px;
            background: #fff;
            color: var(--navy);
            border: 1px solid var(--line);
        }

        .google-button:hover {
            background: #f4f7f9;
            color: var(--navy);
        }

        .login-divider {
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 20px 0 14px;
            color: var(--muted);
            font-size: 12px;
        }

        .login-divider:before,
        .login-divider:after {
            content: '';
            height: 1px;
            flex: 1;
            background: var(--line);
        }

        .auth-switch {
            width: 100%;
            margin-top: 12px;
            padding: 8px;
            background: transparent;
            color: var(--mint-dark);
            font-size: 13px;
        }

        .auth-switch:hover {
            background: transparent;
            color: var(--navy);
            text-decoration: underline;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            padding-bottom: 76px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 11px;
            font-weight: 700;
            letter-spacing: -.03em;
        }

        .access {
            color: var(--muted);
            font: 11px 'DM Mono', monospace;
        }

        .mark {
            width: 30px;
            height: 30px;
            display: grid;
            place-items: center;
            border: 2px solid var(--ink);
            border-radius: 9px 9px 9px 2px;
            background: var(--mint);
            transform: rotate(-7deg);
        }

        .mark:after {
            content: '';
            width: 8px;
            height: 8px;
            border: 2px solid var(--ink);
            border-radius: 50%;
        }

        nav {
            display: flex;
            gap: 18px;
            color: var(--muted);
            font-size: 14px;
        }

        nav a {
            color: inherit;
            text-decoration: none;
        }

        nav button {
            width: auto;
            margin: 0;
            padding: 0;
            background: none;
            color: var(--muted);
            font-size: 14px;
            font-weight: 400;
        }

        nav button:hover {
            background: none;
            color: var(--ink);
        }

        .eyebrow {
            margin: 0 0 14px;
            color: var(--mint-dark);
            font: 500 12px 'DM Mono', monospace;
            letter-spacing: .09em;
            text-transform: uppercase;
        }

        h1 {
            max-width: 760px;
            margin: 0;
            font-size: clamp(42px, 7vw, 82px);
            line-height: .94;
            letter-spacing: -.075em;
            font-weight: 600;
        }

        .intro {
            max-width: 560px;
            margin: 24px 0 48px;
            color: var(--muted);
            font-size: 17px;
            line-height: 1.55;
        }

        .workspace {
            display: grid;
            grid-template-columns: minmax(0, 1.15fr) minmax(320px, .85fr);
            gap: 18px;
            align-items: start;
        }

        .panel {
            background: rgba(255, 253, 248, .9);
            border: 1px solid var(--line);
            border-radius: 8px;
            box-shadow: var(--shadow);
        }

        .panel-head {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 14px;
            padding: 24px 25px 18px;
            border-bottom: 1px solid var(--line);
        }

        h2 {
            margin: 0;
            font-size: 21px;
            letter-spacing: -.04em;
        }

        .index {
            color: var(--coral);
            font: 500 12px 'DM Mono', monospace;
        }

        form {
            padding: 24px 25px 26px;
        }

        label {
            display: grid;
            gap: 7px;
            color: var(--muted);
            font-size: 12px;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 12px 11px;
            border: 1px solid var(--line);
            border-radius: 4px;
            background: var(--panel);
            color: var(--ink);
            outline: none;
        }

        input:focus,
        select:focus,
        textarea:focus {
            border-color: var(--mint-dark);
            box-shadow: 0 0 0 3px rgba(167, 232, 198, .35);
        }

        .drop {
            display: grid;
            place-items: center;
            min-height: 172px;
            padding: 24px;
            border: 1.5px dashed #9cb5a3;
            border-radius: 6px;
            text-align: center;
            background: #f1f8f0;
            cursor: pointer;
        }

        .drop.drag {
            border-color: var(--mint-dark);
            background: #e7f5e8;
        }

        .drop strong {
            display: block;
            margin-bottom: 7px;
            color: var(--ink);
            font-size: 16px;
        }

        .drop span {
            color: var(--muted);
            font-size: 13px;
        }

        .drop input {
            display: none;
        }

        .file-name {
            min-height: 19px;
            margin-top: 11px;
            color: var(--mint-dark);
            font: 500 12px 'DM Mono', monospace;
        }

        .fields {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
            margin-top: 17px;
        }

        .wide {
            grid-column: 1/-1;
        }

        button {
            width: 100%;
            margin-top: 20px;
            padding: 14px 16px;
            border: 0;
            border-radius: 4px;
            background: var(--ink);
            color: #fff;
            font-weight: 600;
        }

        button:hover {
            background: var(--mint-dark);
        }

        button:disabled {
            cursor: wait;
            opacity: .55;
        }

        .panel-head button,
        .project-row button {
            width: auto;
            margin: 0;
            padding: 9px 12px;
            font-size: 12px;
        }

        .side {
            display: grid;
            gap: 18px;
        }

        .status {
            padding: 24px 25px;
            min-height: 144px;
        }

        .status h3 {
            margin: 0 0 12px;
            font-size: 15px;
        }

        .status p {
            margin: 0;
            color: var(--muted);
            font-size: 14px;
            line-height: 1.55;
        }

        .status.ok {
            border-left: 4px solid var(--mint-dark);
        }

        .status.error {
            border-left: 4px solid var(--coral);
        }

        .hint {
            padding: 23px 25px;
            background: var(--ink);
            color: #fff;
            border-radius: 8px;
        }

        .hint strong {
            display: block;
            margin-bottom: 8px;
            color: var(--mint);
            font-size: 16px;
        }

        .hint p {
            margin: 0;
            color: #c9d4ce;
            font-size: 14px;
            line-height: 1.5;
        }

        .mono {
            margin-top: 18px;
            color: #a7b8ae;
            font: 12px 'DM Mono', monospace;
        }

        .section {
            margin-top: 18px;
        }

        textarea {
            min-height: 100px;
            resize: vertical;
            line-height: 1.45;
        }

        .answer {
            margin-top: 18px;
            padding: 20px 22px;
            border-left: 4px solid var(--mint-dark);
            background: #f1f8f0;
            white-space: pre-wrap;
            line-height: 1.55;
        }

        .sources {
            margin-top: 14px;
            color: var(--muted);
            font: 12px/1.5 'DM Mono', monospace;
        }

        .project-list {
            display: grid;
            gap: 10px;
            padding: 20px 25px 25px;
        }

        .project-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 14px;
            padding: 14px;
            border: 1px solid var(--line);
            border-radius: 4px;
            background: var(--panel);
        }

        .project-row strong {
            display: block;
            margin-bottom: 4px;
        }

        .project-row span {
            color: var(--muted);
            font: 12px 'DM Mono', monospace;
        }

        .project-details {
            min-width: 0;
            flex: 1;
        }

        .project-key {
            display: block;
            width: auto;
            margin: 0 0 5px;
            padding: 0;
            border: 0;
            background: none;
            color: var(--mint-dark);
            font-size: 16px;
            text-align: left;
        }

        .project-key:hover {
            background: none;
            text-decoration: underline;
        }

        .document-list {
            display: grid;
            gap: 7px;
            margin-top: 14px;
            padding-top: 12px;
            border-top: 1px solid var(--line);
        }

        .document-item {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            padding: 9px 0;
            color: var(--ink);
            font-size: 13px;
        }

        .document-item strong {
            margin: 0;
            font-size: 13px;
            font-weight: 500;
        }

        .document-item span {
            text-align: right;
        }

        @media (max-width:760px) {
            header {
                padding-bottom: 48px;
            }

            nav a:first-child {
                display: none;
            }

            .workspace {
                grid-template-columns: 1fr;
            }

            h1 {
                font-size: 54px;
            }
        }

        @media (max-width:480px) {
            .shell {
                padding-inline: 16px;
            }

            .fields {
                grid-template-columns: 1fr;
            }

            .wide {
                grid-column: auto;
            }

            nav {
                gap: 10px;
            }
        }

        /* Enterprise workspace layer */
        :root {
            --ink: #172a3a;
            --muted: #667584;
            --paper: #f4f7f9;
            --panel: #fff;
            --line: #dce4ea;
            --mint: #dceff0;
            --mint-dark: #087f8c;
            --coral: #b64a4a;
            --navy: #0c2d48;
            --gold: #d59b32;
            --shadow: 0 12px 30px rgba(17, 42, 62, .07);
        }

        body {
            background: linear-gradient(135deg, #f4f7f9 0%, #eef4f6 50%, #f8fafb 100%);
            font-family: 'IBM Plex Sans', 'Space Grotesk', sans-serif;
        }

        .enterprise-shell {
            min-height: 100vh;
            display: grid;
            grid-template-columns: 244px minmax(0, 1fr);
        }

        .sidebar {
            display: flex;
            flex-direction: column;
            padding: 27px 18px;
            background: var(--navy);
            color: #fff;
        }

        .sidebar .brand {
            color: #fff;
            padding: 0 10px 36px;
        }

        .sidebar .mark {
            border-color: #fff;
            background: var(--gold);
        }

        .sidebar nav {
            display: grid;
            gap: 6px;
        }

        .sidebar nav button {
            width: 100%;
            margin: 0;
            padding: 12px 13px;
            border: 0;
            border-radius: 4px;
            background: transparent;
            color: #b8cbd7;
            text-align: left;
        }

        .sidebar nav button.active,
        .sidebar nav button:hover {
            background: rgba(255, 255, 255, .11);
            color: #fff;
        }

        .nav-icon {
            display: inline-block;
            width: 24px;
            color: var(--gold);
            font-weight: 700;
        }

        .sidebar-footer {
            margin-top: auto;
            padding: 15px 12px 0;
            border-top: 1px solid rgba(255, 255, 255, .15);
            color: #a9bfcc;
            font-size: 12px;
            line-height: 1.5;
        }

        .sidebar-footer strong {
            display: block;
            color: #fff;
            margin-bottom: 4px;
        }

        .main-content {
            min-width: 0;
            padding: 25px clamp(20px, 4vw, 52px) 54px;
        }

        .page-heading {
            padding: 30px 0 4px;
        }

        .topbar nav button {
            width: auto;
            margin: 0;
            padding: 8px 11px;
            border: 1px solid var(--line);
            background: #fff;
            color: var(--muted);
            font-size: 14px;
            font-weight: 400;
        }

        .topbar nav button:hover {
            background: #f8fafb;
            color: var(--ink);
        }

        .shell {
            max-width: 1320px;
            padding: 25px clamp(20px, 4vw, 52px) 54px;
        }

        header {
            padding-bottom: 23px;
            border-bottom: 1px solid var(--line);
        }

        .brand {
            letter-spacing: -.02em;
        }

        .mark {
            border-radius: 4px;
            background: var(--mint-dark);
        }

        .eyebrow,
        .index {
            color: var(--mint-dark);
            font-family: 'IBM Plex Mono', 'DM Mono', monospace;
        }

        h1 {
            max-width: 760px;
            color: var(--navy);
            font-size: clamp(34px, 4vw, 52px);
            line-height: 1.05;
            letter-spacing: -.04em;
        }

        h2 {
            color: var(--navy);
            font-size: 19px;
            letter-spacing: -.02em;
        }

        .intro {
            margin: 13px 0 28px;
            max-width: 650px;
            font-size: 16px;
        }

        .workspace {
            grid-template-columns: minmax(0, 1.2fr) minmax(300px, .8fr);
        }

        .panel {
            background: #fff;
            border: 1px solid var(--line);
            border-radius: 5px;
            box-shadow: var(--shadow);
        }

        .panel-head {
            padding: 20px 22px 17px;
        }

        input,
        select,
        textarea {
            background: #fbfcfd;
        }

        input:focus,
        select:focus,
        textarea:focus {
            border-color: var(--mint-dark);
            box-shadow: 0 0 0 3px rgba(8, 127, 140, .13);
        }

        .drop {
            min-height: 154px;
            border-color: #92b8bd;
            background: #e6f4f3;
        }

        .drop.drag {
            border-color: var(--mint-dark);
            background: #d8efed;
        }

        button {
            background: var(--navy);
            border-radius: 4px;
        }

        button:hover {
            background: var(--mint-dark);
        }

        .hint {
            background: var(--navy);
            border-radius: 5px;
        }

        .hint strong {
            color: #f0c463;
        }

        .status.ok {
            border-left-color: var(--mint-dark);
        }

        .status.error {
            border-left-color: var(--coral);
        }

        .answer {
            margin-top: 18px;
            padding: 22px 24px;
            border-left: 4px solid var(--mint-dark);
            background: #e6f4f3;
            border-radius: 0 6px 6px 0;
            line-height: 1.6;
        }

        /* Formatted Answer & Citation Highlights */
        .formatted-answer {
            color: var(--ink);
            font-size: 14.5px;
        }

        .formatted-answer .answer-h1,
        .formatted-answer .answer-h2,
        .formatted-answer .answer-h3 {
            color: var(--navy);
            margin: 18px 0 10px;
            font-weight: 700;
            letter-spacing: -.02em;
        }

        .formatted-answer .answer-h1 {
            font-size: 20px;
        }

        .formatted-answer .answer-h2 {
            font-size: 18px;
        }

        .formatted-answer .answer-h3 {
            font-size: 15.5px;
            display: flex;
            align-items: center;
            gap: 8px;
            border-bottom: 1px solid rgba(8, 127, 140, .18);
            padding-bottom: 5px;
        }

        .formatted-answer .answer-h3:before {
            content: '';
            display: inline-block;
            width: 4px;
            height: 14px;
            background: var(--mint-dark);
            border-radius: 2px;
            flex-shrink: 0;
        }

        .formatted-answer p {
            margin: 8px 0 10px;
            line-height: 1.62;
        }

        .formatted-answer ul,
        .formatted-answer ol {
            margin: 6px 0 12px;
            padding-left: 22px;
        }

        .formatted-answer li {
            margin-bottom: 6px;
            line-height: 1.55;
        }

        .formatted-answer li.answer-sub-item {
            margin-left: 18px;
            list-style-type: circle;
            color: #2b3e44;
        }

        .formatted-answer strong,
        .formatted-answer .answer-bold {
            color: var(--navy);
            font-weight: 600;
        }

        .formatted-answer .citation-pill {
            display: inline-flex;
            align-items: center;
            padding: 1px 7px;
            margin: 0 3px;
            background: #d4efe9;
            color: #0d5f57;
            border: 1px solid #9dd7cc;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 600;
            font-family: 'IBM Plex Mono', 'DM Mono', monospace;
            vertical-align: baseline;
            box-shadow: 0 1px 2px rgba(8, 127, 140, .1);
            transition: all .15s ease;
        }

        .formatted-answer .citation-pill:hover {
            background: var(--mint-dark);
            color: #fff;
            border-color: var(--mint-dark);
        }

        .formatted-answer .inline-code {
            background: #eef2f5;
            color: #172a3a;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 12px;
            font-family: 'IBM Plex Mono', 'DM Mono', monospace;
        }

        .formatted-answer .answer-divider {
            border: 0;
            border-top: 1px solid rgba(8, 127, 140, .2);
            margin: 18px 0;
        }


        .project-row {
            background: #fff;
            border-color: var(--line);
        }

        .project-key {
            color: var(--mint-dark);
        }

        .document-list {
            border-color: var(--line);
        }

        .metric-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 14px;
            margin: 24px 0;
        }

        .metric {
            padding: 18px 20px;
            border: 1px solid var(--line);
            border-radius: 5px;
            background: #fff;
            box-shadow: var(--shadow);
        }

        .metric-label {
            color: var(--muted);
            font-size: 12px;
        }

        .metric-value {
            display: block;
            margin-top: 6px;
            color: var(--navy);
            font-size: 27px;
            font-weight: 600;
        }

        .metric-note {
            color: var(--mint-dark);
            font-size: 11px;
        }

        .toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            padding: 18px 22px;
            border-bottom: 1px solid var(--line);
        }

        .toolbar button {
            width: auto;
            margin: 0;
            padding: 9px 12px;
            font-size: 12px;
        }

        .source-card {
            margin-top: 10px;
            padding: 13px 15px;
            border: 1px solid var(--line);
            background: #fff;
        }

        .source-card strong {
            display: block;
            margin-bottom: 5px;
            color: var(--navy);
        }

        .source-card span {
            color: var(--muted);
            font: 11px 'IBM Plex Mono', monospace;
        }

        .pill {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 12px;
            background: #e6f4f3;
            color: var(--mint-dark);
            font: 11px 'IBM Plex Mono', monospace;
        }

        /* Database Explorer & Enhanced UI Styles */
        .db-explorer {
            margin-top: 18px;
        }

        .db-toolbar {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            align-items: center;
            justify-content: space-between;
            padding: 16px 20px;
            background: #fff;
            border-bottom: 1px solid var(--line);
        }

        .db-filter-group {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            align-items: center;
            flex: 1;
        }

        .db-search-input {
            min-width: 240px;
            max-width: 360px;
            padding: 9px 12px;
            font-size: 13px;
        }

        .db-select {
            width: auto;
            min-width: 140px;
            padding: 9px 12px;
            font-size: 13px;
        }

        .view-toggle {
            display: flex;
            gap: 4px;
            background: var(--paper);
            padding: 3px;
            border-radius: 6px;
            border: 1px solid var(--line);
        }

        .view-toggle button {
            width: auto;
            margin: 0;
            padding: 6px 12px;
            font-size: 12px;
            background: transparent;
            color: var(--muted);
            border-radius: 4px;
            font-weight: 500;
        }

        .view-toggle button.active {
            background: #fff;
            color: var(--navy);
            box-shadow: 0 1px 3px rgba(0, 0, 0, .08);
        }

        .db-table-wrapper {
            overflow-x: auto;
            background: #fff;
        }

        .db-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
            text-align: left;
        }

        .db-table th {
            padding: 12px 16px;
            background: #f8fafb;
            color: var(--muted);

        /* --- Element-by-Element Spotlight Tour Styles --- */
        .tour-overlay-root {
            position: fixed;
            inset: 0;
            z-index: 9990;
            pointer-events: none;
        }

        .tour-spotlight {
            position: fixed;
            border-radius: 10px;
            box-shadow: 0 0 0 9999px rgba(15, 23, 42, 0.72), 0 0 25px rgba(16, 185, 129, 0.7);
            border: 2px solid #10b981;
            z-index: 9991;
            pointer-events: none;
            transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .tour-popover {
            position: fixed;
            z-index: 9999;
            width: min(92vw, 380px);
            max-height: min(calc(100vh - 32px), 440px);
            background: #ffffff;
            border: 1px solid var(--line);
            border-radius: 14px;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.35);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            pointer-events: auto;
            animation: tourPop 0.2s cubic-bezier(0.16, 1, 0.3, 1);
            transition: top 0.15s ease-out, left 0.15s ease-out;
        }

        @keyframes tourPop {
            from {
                opacity: 0;
                transform: scale(0.92) translateY(6px);
            }
            to {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
